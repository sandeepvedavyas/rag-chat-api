server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: rag-chat-api
  codec:
    max-in-memory-size: 2MB
  webflux:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}]"

info:
  app:
    name: rag-chat-api
    description: Portfolio RAG chat API
    version: 0.1.0

rag:
  auth:
    api-key: ${RAG_API_KEY:local-dev-key}
  ingest:
    max-bytes: 1048576
    chunk-size: 800
    chunk-overlap: 120
    embedding-batch-size: 16
  retrieval:
    top-k: 4
    min-score: 0.2
  llm:
    openai-base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
    openai-api-key: ${OPENAI_API_KEY:}
    gateway-base-url: ${GATEWAY_BASE_URL:}
    gateway-api-key: ${GATEWAY_API_KEY:}
    chat-model: ${OPENAI_CHAT_MODEL:llama3.2}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:nomic-embed-text}
    timeout: 30s
    max-retries: 2
    temperature: 0.1
