services:
  rag-chat-api:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      RAG_API_KEY: ${RAG_API_KEY:-local-dev-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-llama3.2}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-nomic-embed-text}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
